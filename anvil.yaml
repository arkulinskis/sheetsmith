    \ macros and get a web app plus a small Python server that runs on your local network.\">\n<meta name=\"twitter:image\"\
    \ content=\"https://sheetsmith.anvil.app/_/theme/og-image.png\">\n<link rel=\"alternate\" type=\"text/plain\" title=\"\
    Sheetsmith for AI assistants\" href=\"https://sheetsmith.anvil.app/llms.txt\">\n<script type=\"application/ld+json\">{\"\
    @context\": \"https://schema.org\", \"@graph\": [{\"@type\": \"WebApplication\", \"@id\": \"https://sheetsmith.anvil.app/#app\"\
    , \"name\": \"Sheetsmith\", \"url\": \"https://sheetsmith.anvil.app/\", \"description\": \"Upload an Excel workbook with\
