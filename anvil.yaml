        order: 0
        width: 200
      name: key
      type: string
    - admin_ui:
        order: 1
        width: 200
      name: value
      type: simpleObject
    indexes: []
    server: full
    title: App settings
  feedback:
    client: none
    columns:
    - admin_ui:
        order: 0
        width: 200
      name: user
      target: users
      type: link_single
    - admin_ui:
        order: 1
        width: 200
      name: name
      type: string
    - admin_ui:
        order: 2
        width: 200
      name: email
      type: string
    - admin_ui:
        order: 3
        width: 200
      name: kind
      type: string
    - admin_ui:
        order: 4
        width: 200
      name: message
