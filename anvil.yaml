    \ that runs on your local network.\">\n<meta property=\"og:locale\" content=\"en_CA\">\n<meta property=\"og:url\" content=\"\
    https://sheetsmith.anvil.app/\">\n<meta property=\"og:image\" content=\"https://sheetsmith.anvil.app/_/theme/og-image.png\"\
    >\n<meta property=\"og:image:width\" content=\"1200\"><meta property=\"og:image:height\" content=\"630\">\n<meta property=\"\
    og:image:alt\" content=\"Sheetsmith: Turn an Excel workbook into a web app for your whole team\">\n<meta name=\"twitter:card\"\
    \ content=\"summary_large_image\">\n<meta name=\"twitter:title\" content=\"Sheetsmith: turn an Excel workbook into a web\
