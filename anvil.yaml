    <script type="application/ld+json">{"@context": "https://schema.org", "@graph": [{"@type": "WebApplication", "@id": "https://sheetsmith.anvil.app/#app", "name": "Sheetsmith", "url": "https://sheetsmith.anvil.app/", "description": "Upload an Excel workbook with its tables, formulas, rules and VBA macros and get a web app plus a small Python server that runs on your local network.", "image": "https://sheetsmith.anvil.app/_/theme/og-image.png", "inLanguage": "en", "publisher": {"@id": "https://arkvital.com/#org"}, "keywords": "excel to web app, convert excel to app, spreadsheet to web app, vba macros to web, xlsm converter, excel database for teams, local network app, no-code excel app, share excel on wifi", "applicationCategory": "BusinessApplication", "operatingSystem": "Any (web browser)", "browserRequirements": "Requires JavaScript and a modern web browser", "featureList": ["Try a workbook without signing up: it is read in memory and nothing is stored", "Keeps tables, formulas, data validation, conditional formats and supported VBA macros", "A studio to adjust screens and preview the app live", "Download a zip with index.html, server.py, start scripts and a README", "Runs on any computer on a local network, so the whole team shares one copy of the data", "Example workbooks (bakery orders, a tool library, a flooring quote) to explore"], "audience": {"@type": "Audience", "audienceType": "Small businesses and teams that run on an Excel workbook and want it as a shared app"}}, {"@type": "WebSite", "@id": "https://sheetsmith.anvil.app/#site", "url": "https://sheetsmith.anvil.app/", "name": "Sheetsmith", "publisher": {"@id": "https://arkvital.com/#org"}}, {"@type": "Organization", "@id": "https://arkvital.com/#org", "name": "Arkvital", "url": "https://arkvital.com", "email": "arkvital@outlook.com", "address": {"@type": "PostalAddress", "addressLocality": "Montreal", "addressRegion": "QC", "addressCountry": "CA"}}]}</script>
