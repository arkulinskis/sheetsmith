metadata:
  description: Upload an Excel workbook with its tables, rules and VBA macros and get a web app with a small Python server
    that runs on any local network.
  logo_img: asset:icon-512.png
  title: 'Sheetsmith: turn an Excel workbook into a web app'
name: Sheetsmith
native_deps:
  head_html: "<script src=\"_/theme/legal-kit.js?v=38a9daabdf\"></script>\n<meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1, viewport-fit=cover\">\n<meta name=\"theme-color\" content=\"#1d7a4f\">\n<meta name=\"apple-mobile-web-app-capable\"\
    \ content=\"yes\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"\
    https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap\"\
    \ rel=\"stylesheet\">\n<link id=\"ui-favicon\" rel=\"icon\" type=\"image/svg+xml\" href=\"_/theme/icon.svg?v=6daccb156f\"\
    >\n<link rel=\"apple-touch-icon\" href=\"_/theme/icon-180.png?v=6daccb156f\">\n<script>\n/* Keep our tab icon: Anvil adds\
    \ its own <link rel=\"icon\">, so drop any other icon link. */\n(function () {\n  function keep() {\n    var ours = document.getElementById('ui-favicon');\n\
    \    if (!ours) return;\n    document.querySelectorAll('link[rel~=\"icon\"]').forEach(function (l) { if (l !== ours) l.remove();\
    \ });\n  }\n  keep();\n  document.addEventListener('DOMContentLoaded', keep);\n  window.addEventListener('load', keep);\n\
    })();\n</script>\n<link rel=\"stylesheet\" href=\"_/theme/app.css?v=fed4f1bf01\">\n<script src=\"_/theme/app.js?v=4a6188f4ff\"\
    ></script>\n"
package_name: Sheetsmith
runtime_options:
  client_version: '3'
  server_spec:
    base: python314
  version: 3
services:
- client_config:
    enable_v2: true
  server_config: {}
  source: /runtime/services/tables.yml
- client_config:
    allow_remember_me: true
    allow_signup: true
    confirm_email: false
    enable_automatically: true
    remember_me_days: 30
    require_secure_passwords: true
    use_email: true
  server_config:
    user_table: users
  source: /runtime/services/anvil/users.yml
startup:
  module: Main
  type: form
