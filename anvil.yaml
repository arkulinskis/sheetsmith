    <link href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap\"\
    \ rel=\"stylesheet\">\n<link id=\"ui-favicon\" rel=\"icon\" type=\"image/svg+xml\" href=\"_/theme/icon.svg?v=6daccb156f\"\
    >\n<link rel=\"apple-touch-icon\" href=\"_/theme/icon-180.png?v=6daccb156f\">\n<script>\n/* Keep our tab icon: Anvil adds\
