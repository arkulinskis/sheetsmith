        order: 1
        width: 200
      name: name
      type: string
    - admin_ui:
        order: 2
        width: 200
      name: file_name
      type: string
    - admin_ui:
        order: 3
        width: 200
      name: file
      type: media
    - admin_ui:
        order: 4
        width: 200
      name: blueprint
      type: media
    - admin_ui:
        order: 5
        width: 200
      name: summary
      type: simpleObject
    - admin_ui:
        order: 6
        width: 200
      name: settings
      type: simpleObject
