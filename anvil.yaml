    \ orders, a tool library, a flooring quote) to explore\"], \"audience\": {\"@type\": \"Audience\", \"audienceType\": \"\
    Small businesses and teams that run on an Excel workbook and want it as a shared app\"}}, {\"@type\": \"WebSite\", \"\
    @id\": \"https://sheetsmith.anvil.app/#site\", \"url\": \"https://sheetsmith.anvil.app/\", \"name\": \"Sheetsmith\", \"\
    publisher\": {\"@id\": \"https://arkvital.com/#org\"}}, {\"@type\": \"Organization\", \"@id\": \"https://arkvital.com/#org\"\
    , \"name\": \"Arkvital\", \"url\": \"https://arkvital.com\", \"email\": \"arkvital@outlook.com\", \"address\": {\"@type\"\
    : \"PostalAddress\", \"addressLocality\": \"Montreal\", \"addressRegion\": \"QC\", \"addressCountry\": \"CA\"}}]}</script>\n\
    <!-- seo:end -->\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<meta\
    \ name=\"theme-color\" content=\"#1d7a4f\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<link rel=\"\
