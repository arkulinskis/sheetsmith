<div class="st-sc-host">
  <div class="ui-card st-sc" anvil:name="box">
    <span class="ic-box"><i class="ic" anvil:name="icon"></i></span>
    <div class="grow">
      <anvil-component type="Label" name="label" prop:role='["st-sc-name"]' bind:text="self.item['label']"></anvil-component>
      <anvil-component type="Label" name="line" prop:role='["st-sc-line"]' bind:text="self.item['line']"></anvil-component>
    </div>
    <anvil-component type="Label" name="badge" prop:role='["badge"]'></anvil-component>
  </div>
</div>
